data_root: ./data/NW-UCLA
output_dir: ./artifacts/skeleton/nw_ucla_ctrgcn_xview_joint
dataset: nw_ucla
protocol: xview
stream: joint
model: ctrgcn
graph_layout: nw-ucla
graph_strategy: spatial
graph_normalization: partition-wise
epochs: 65
loader:
  batch_size: 16
  num_workers: 8
  persistent_workers: true
optimizer:
  name: sgd
  learning_rate: 0.1
  weight_decay: 0.0001
  params:
    momentum: 0.9
    nesterov: true
scheduler:
  name: multistep
  params:
    milestones: [50]
    gamma: 0.1
runtime:
  device: cuda
  seed: 1
  checkpoint_interval: 1

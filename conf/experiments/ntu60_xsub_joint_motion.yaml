data_root: ./data/ntu
output_dir: ./artifacts/skeleton/ntu60_ctrgcn_xsub_joint_motion
dataset: ntu60
protocol: xsub
stream: joint_motion
model: ctrgcn
graph_layout: ntu-rgb+d
graph_strategy: spatial
graph_normalization: partition-wise
epochs: 65
dataset_params:
  data_file: data.npy
  label_file: labels.pkl
  window_size: 64
  p_interval: [0.5, 1.0]
  random_rot: true
loader:
  batch_size: 16
  num_workers: 0
  persistent_workers: false
optimizer:
  name: sgd
  learning_rate: 0.1
  weight_decay: 0.0004
  params:
    momentum: 0.9
    nesterov: true
scheduler:
  name: multistep
  params:
    milestones: [35, 55]
    gamma: 0.1
runtime:
  device: cuda
  seed: 1
  checkpoint_interval: 1
  grad_accum_steps: 4
